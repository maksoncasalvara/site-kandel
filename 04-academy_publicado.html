<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kandel Medical — Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --red: #d44f4c; --red-hover: #b8413f;
      --near-black: #0c1e2c; --dark-card: #0c1e2c;
      --gray: #86868b;
      --font: 'Outfit', system-ui, -apple-system, sans-serif;
    }
    body { font-family: var(--font); background: var(--near-black); color: #fff; -webkit-font-smoothing: antialiased; }

    .section { padding: 100px 28px; }
    .sec-inner { max-width: 1200px; margin: 0 auto; }
    .sec-tag { font-size: 12px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--red); margin-bottom: 10px; }
    .sec-title { font-size: clamp(28px, 4vw, 50px); font-weight: 700; letter-spacing: -0.03em; line-height: 1.08; margin-bottom: 14px; color: #fff; }

    /* ── Header ── */
    .academy-header {
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: 24px; margin-bottom: 52px;
    }
    .academy-header a {
      font-size: 15px; font-weight: 500; color: var(--red);
      text-decoration: none; white-space: nowrap;
    }
    .academy-header a:hover { text-decoration: underline; }

    /* ── Grid ── */
    .academy-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .article-card {
      background: var(--dark-card);
      border-radius: 18px; overflow: hidden;
      display: flex; flex-direction: column;
      text-decoration: none; color: inherit;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .article-card:hover { transform: translateY(-4px); box-shadow: 0 20px 48px rgba(12,30,44,0.4); }

    .article-thumb {
      width: 100%; aspect-ratio: 16/10;
      overflow: hidden; position: relative;
    }
    .article-thumb img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.4s ease;
    }
    .article-card:hover .article-thumb img { transform: scale(1.04); }

    .article-body { padding: 24px 22px 28px; flex: 1; display: flex; flex-direction: column; }
    .article-cat {
      font-size: 11px; font-weight: 700; letter-spacing: 0.09em;
      text-transform: uppercase; color: var(--red); margin-bottom: 10px;
    }
    .article-title {
      font-size: 16px; font-weight: 600; line-height: 1.45;
      color: rgba(255,255,255,0.90); margin-bottom: 12px; flex: 1;
    }
    .article-meta {
      font-size: 12px; color: rgba(255,255,255,0.35);
      display: flex; align-items: center; gap: 8px; margin-top: auto;
    }
    .article-meta::before { content: ''; display: block; width: 24px; height: 1px; background: rgba(255,255,255,0.15); }

    /* ── Featured card (first) ── */
    .article-card-featured {
      grid-column: span 2;
    }
    .article-card-featured .article-thumb { aspect-ratio: 16/9; }
    .article-card-featured .article-title { font-size: 20px; }

    /* ── Scroll reveal ── */
    .rev { opacity: 0; transform: translateY(28px); transition: opacity 0.75s ease, transform 0.75s ease; }
    .rev.vis { opacity: 1; transform: none; }
    .rev.d1{transition-delay:.10s} .rev.d2{transition-delay:.18s} .rev.d3{transition-delay:.26s} .rev.d4{transition-delay:.34s}

    /* ── Responsive ── */
    @media (max-width: 1024px) {
      .academy-grid { grid-template-columns: repeat(2, 1fr); }
      .article-card-featured { grid-column: span 2; }
    }
    @media (max-width: 620px) {
      .academy-grid { grid-template-columns: 1fr; }
      .article-card-featured { grid-column: span 1; }
      .academy-header { flex-direction: column; align-items: flex-start; gap: 12px; }
      .section { padding: 64px 20px; }
    }
  </style>
</head>
<body>

<section class="section" id="academy">
  <div class="sec-inner">
    <div class="academy-header rev">
      <div>
        <div class="sec-tag">Kandel Academy</div>
        <h2 class="sec-title">Conhecimento que<br>capacita profissionais.</h2>
      </div>
      <a href="https://www.kandel.com.br/blog" target="_top">Ver todos os artigos →</a>
    </div> 
    </div>
  </div>
</section>


<script>
  const io = new IntersectionObserver(e => e.forEach(x => x.isIntersecting && (x.target.classList.add('vis'), io.unobserve(x.target))), {threshold:.1});
  document.querySelectorAll('.rev').forEach(el => io.observe(el));
</script>
</body>
</html>
